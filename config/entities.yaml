# Справочник объектов ГК «Балтийский Дом».
# Источник: «Информация о ГК.docx» (адреса), + сверка с официальным перечнем УК Мурино (mo-murino.ru, сентябрь 2026).
# Редактируется в GUI → «Объекты». Поля:
#   aliases        — как нас называют в сети (склонения ловятся автоматически)
#   ambiguous      — true: слово многозначное (театр «Балтийский дом», имя «Виктория», город «Москва»),
#                    засчитывается только при «жилищном» контексте рядом или с префиксом ЖК/УК
#   surface_only   — сравнивать только точное написание (короткие/несклоняемые: «Лампо»)
#   negative       — слова, при которых совпадение НЕ наше (дворец Монплезир, театр «Балтийский дом»)
#   hard_negative  — признак ДРУГОЙ организации с тем же именем: не наше даже с «УК …»/«ЖК …» перед названием
#                    (УК «Петербургский дом-Центр», «УК Балтийский дом» в Калининграде, ЖК «Цивилизация» ЛСР)
#   district       — пусто = не уточнено (заполните в GUI — влияет на выбор районных пабликов)

